      var body = document.querySelector('.in-post-body');
      function update() {
        var start = body.offsetTop - 80;
        var end = body.offsetTop + body.offsetHeight - window.innerHeight + 40;
        var t = (window.scrollY - start) / Math.max(end - start, 1);
        bar.style.transform = 'scaleX(' + Math.min(Math.max(t, 0), 1) + ')';
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    })();
  </script>
  
</body>
</html>
